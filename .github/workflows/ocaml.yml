name: OCaml client

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'clients/ocaml/**'
      - 'docs/api/ocaml/**'
      - 'relate/**'
      - 'surfaces/relate-ffi/**'
      - 'testing/relate-test-support/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - '.github/workflows/ocaml.yml'
  push:
    branches: [main, 'feat/**']
    paths:
      - 'clients/ocaml/**'
      - 'docs/api/ocaml/**'
      - 'relate/**'
      - 'surfaces/relate-ffi/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - '.github/workflows/ocaml.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ocaml-${{ github.ref }}-${{ github.event.pull_request.draft || false }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  DO_NOT_TRACK: '1'
  RELATE_FFI_LIB_DIR: ${{ github.workspace }}/target/debug
  RELATE_UPSTREAM_HEADER: ${{ github.workspace }}/surfaces/relate-ffi/include/relate.h
  LD_LIBRARY_PATH: ${{ github.workspace }}/target/debug
  DYLD_LIBRARY_PATH: ${{ github.workspace }}/target/debug

jobs:
  test:
    name: OCaml (${{ matrix.os }}, OCaml ${{ matrix.ocaml }})
    # Drafts run one host; ready PRs, main and manual runs cover all three.
    # 5.4.1 is the development pin. The declared floor (5.0.0, in
    # relate.opam's depends) cannot run here: setup-ocaml's switch
    # initialisation fails on it with current opam (exit 31 during
    # ocaml-options-vanilla) — verify the floor locally until the action
    # fixes it. The header guard compares against the checkout's FFI copy
    # (RELATE_UPSTREAM_HEADER), so CI never passes on the package-mode
    # skip.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.draft && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
        ocaml: ['5.4.1']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@263313d2989f864a2b8613f97277288638e7d8f8 # 1.99.1
        with:
          toolchain: '1.99'
      - uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
        with:
          ocaml-compiler: ${{ matrix.ocaml }}
      - name: Build native library from this commit
        run: cargo build --locked -p relate-ffi
      - name: Prepare the native for OCaml linking (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # ocamlmklib's DLL step on Windows goes through flexlink, which
          # treats -l/-L flags as literal file paths, not search flags.
          # RELATE_FFI_LINK carries the full path to the MSVC import
          # library instead; the seam's -L/-rpath terms are inert there.
          lib="$PWD/target/debug/relate_ffi.dll.lib"
          [ -f "$lib" ] || lib="$PWD/target/debug/relate_ffi.lib"
          [ -f "$lib" ] || {
            echo "error: no relate_ffi import library under target/debug" >&2
            exit 1
          }
          echo "RELATE_FFI_LINK=$lib" >> "$GITHUB_ENV"
          echo "RELATE_FFI_LIB_DIR=$PWD/target/debug" >> "$GITHUB_ENV"
      - name: Install the client's OCaml dependencies
        working-directory: clients/ocaml
        run: opam install -y --deps-only .
      - name: Build the client
        working-directory: clients/ocaml
        shell: bash
        run: |
          eval $(opam env)
          export PATH="$RELATE_FFI_LIB_DIR:$PATH"
          dune build
      - name: Test the client
        working-directory: clients/ocaml
        shell: bash
        run: |
          eval $(opam env)
          export PATH="$RELATE_FFI_LIB_DIR:$PATH"
          dune test
      - name: Run documented examples
        shell: bash
        run: |
          eval $(opam env)
          export PATH="$RELATE_FFI_LIB_DIR:$PATH"
          bash scripts/check-ocaml-examples.sh
      - name: Rehearse the install image
        working-directory: clients/ocaml
        shell: bash
        run: |
          eval $(opam env)
          export PATH="$RELATE_FFI_LIB_DIR:$PATH"
          dune build @install
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ocaml-${{ matrix.os }}-${{ matrix.ocaml }}
          path: |
            clients/ocaml/_build/install/default/lib/**
            clients/ocaml/_build/log
          if-no-files-found: warn
